<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#063c33">
  <meta name="color-scheme" content="light">
  <title>mosque.build — Offline</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,sans-serif;background:#f7f3ea;color:#16302a;display:grid;min-height:100vh;min-height:100dvh;place-items:center;line-height:1.6}
    main{width:100%;max-width:600px;padding:32px max(20px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));padding-top:max(32px,env(safe-area-inset-top));overflow-wrap:anywhere}
    h1{font-size:clamp(1.8rem,6vw,2.5rem);line-height:1.2;margin:0 0 20px}
    p{margin:0 0 20px}
    nav{display:flex;flex-wrap:wrap;gap:12px}
    a{display:inline-flex;align-items:center;min-height:44px;padding:12px 18px;border:2px solid #063c33;border-radius:12px;color:#063c33;text-decoration:underline;font-weight:700}
    a:first-child{background:#063c33;color:white}
    a:focus-visible{outline:3px solid #96752a;outline-offset:4px}
    a:hover{text-decoration-thickness:2px}
  </style>
</head>
<body>
  <main id="main-content">
    <h1>You’re offline.</h1>
    <p>We couldn’t load this page. Your locally saved work has not been changed.</p>
    <p>Reconnect and try again. Some pages you opened earlier may still be available on this device; online services and external sources need a connection.</p>
    <nav aria-label="Offline options"><a href="">Try this page again</a><a href="/">Open home</a></nav>
  </main>
</body>
</html>

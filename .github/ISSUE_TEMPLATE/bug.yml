name: Bug report
description: Report a reproducible problem without sharing personal or project-sensitive data.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Do not include names, addresses, private project records, credentials or security vulnerabilities. Report security issues using SECURITY.md."
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Describe the observable problem and expected behavior using neutral sample data.
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the smallest reliable sequence.
    validations: {required: true}
  - type: dropdown
    id: viewport
    attributes:
      label: Surface
      options: ["Mobile browser", "Desktop browser", "Installed app view", "Offline", "Repository/tooling"]
    validations: {required: true}
  - type: textarea
    id: checks
    attributes:
      label: Accessibility, console and screenshots
      description: Remove personal data before attaching evidence.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal, project-sensitive and credential data.
          required: true

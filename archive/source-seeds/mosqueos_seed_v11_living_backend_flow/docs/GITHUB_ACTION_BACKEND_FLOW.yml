name: Validate Living Backend Flow

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_backend_flow.py
      - run: python scripts/generate_backend_flow.py
      - name: Fail if generated flow is stale
        run: git diff --exit-code -- flows docs/BACKEND_PROCESS_CATALOG.md
